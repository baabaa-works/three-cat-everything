<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0d14;
        --frame: #1e2433;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: radial-gradient(120% 60% at 50% 0%, #1a1420 0%, var(--ground) 60%);
      }
      /* 4:5 window onto the recording (source crop 712×890 at 1.4607×) */
      #stage {
        position: absolute;
        left: 20px;
        top: 340px;
        width: 1040px;
        height: 1300px;
        overflow: hidden;
        border-radius: 28px;
        box-shadow: 0 0 0 2px var(--frame), 0 30px 80px rgba(0, 0, 0, 0.6);
        background: #131722;
      }
      #stage-pan {
        position: absolute;
        left: -26px; /* hide the window-edge glow at the crop's left */
        top: 0;
        width: 1373px;
        height: 1300px;
        transform-origin: 400px 0px;
      }
      #footage {
        width: 1373px;
        height: 1300px;
        display: block;
      }
      #captions,
      #endcard {
        position: absolute;
        inset: 0;
      }
      #captions {
        z-index: 5;
      }
      #endcard {
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="23.5"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage">
        <div id="stage-pan" data-layout-allow-overflow>
          <video
            id="footage"
            class="clip"
            src="assets/footage.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="23.5"
            data-track-index="0"
          ></video>
        </div>
      </div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="20"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="20"
        data-duration="3.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio
        id="music"
        class="clip"
        src="assets/music.m4a"
        data-start="0"
        data-duration="23.5"
        data-track-index="4"
        data-volume="0.9"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const PAN = -307; // shows source x 300..1012, where the cats first appear
      tl.fromTo("#stage-pan", { x: 0, scale: 1 }, { x: PAN, duration: 0.6, ease: "power2.inOut" }, 2.667); // lands on the 3.267 cut
      // follow the drag back to the chart centre
      tl.to("#stage-pan", { x: 0, duration: 0.85, ease: "power2.inOut" }, 6.65);
      // slow punch-in on both groups
      tl.to("#stage-pan", { scale: 1.1, duration: 3.3, ease: "sine.inOut" }, 16.7);
      tl.to("#stage", { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 20);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
